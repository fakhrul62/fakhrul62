<svg xmlns="http://www.w3.org/2000/svg" width="900" height="248" viewBox="0 0 900 248"><rect x="0" y="0" width="900" height="248" fill="#0d1117"/><rect x="0" y="0" width="900" height="4" fill="#65E4FF"/><rect x="0" y="4" width="240" height="244" fill="#292638"/><g transform="translate(0 34.0)"><path d="M47 44h174v33q-14 6 0 14v59H47v-59q14-8 0-14Z" fill="#F5F4E8" stroke="#10121A" stroke-width="3"/><path d="M36 35h174v33q-14 6 0 14v59H36v-59q14-8 0-14Z" fill="#F5F4E8" stroke="#10121A" stroke-width="3"/><g class="ticket"><path d="M25 26h174v33q-14 6 0 14v59H25v-59q14-8 0-14Z" fill="#F5F4E8" stroke="#10121A" stroke-width="3"/><text x="38" y="52" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#10121A">CIVICDESK</text><path d="M39 65H177 M39 81H119 M39 92H99" class="" fill="none" stroke="#10121A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="stamp"><circle cx="161" cy="97" r="19" fill="#65E4FF" class=""/><path d="M149 97l8 8 15-17" class="" fill="none" stroke="#10121A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="268" y="40" font-family="Consolas,monospace" font-size="15" font-weight="700" fill="#65E4FF">COMPLAINT MANAGEMENT</text><text x="268" y="91" font-family="Impact,Arial Black,sans-serif" font-size="44" font-weight="400" fill="#F5F4E8">CivicDesk</text><text x="268" y="124" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">A citizen files a complaint. A server action validates</text><text x="268" y="150" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">the form and saves a ticket. Agents and supervisors</text><text x="268" y="176" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">track it through resolution.</text><text x="268" y="230" font-family="Consolas,monospace" font-size="15" font-weight="400" fill="#65E4FF">Next.js / Prisma / PostgreSQL</text></svg>