<svg xmlns="http://www.w3.org/2000/svg" width="460" height="438" viewBox="0 0 460 438"><style>@media(prefers-reduced-motion:no-preference){
.contour{animation:contour 5s linear infinite;stroke-dasharray:10 8}
@keyframes contour{to{stroke-dashoffset:-72}}
.ticket{animation:ticket 4.8s ease-in-out infinite}@keyframes ticket{0%,22%,100%{transform:translate(0,0)}58%,76%{transform:translate(12px,-12px)}}
.stamp{animation:stamp 4.8s ease-in-out infinite;transform-origin:161px 97px}@keyframes stamp{0%,26%,93%,100%{opacity:0;transform:scale(1.3)}43%,82%{opacity:1;transform:scale(1)}}
.flight{animation:flight 5s linear infinite;stroke-dasharray:9 9}@keyframes flight{to{stroke-dashoffset:-90}}
.beacon{animation:beacon 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beacon{0%,100%{opacity:.8;transform:scale(.8)}80%{opacity:.1;transform:scale(1.7)}}
}</style><rect x="0" y="0" width="460" height="438" fill="#10121A"/><rect x="0" y="0" width="460" height="4" fill="#65E4FF"/><rect x="0" y="4" width="460" height="167" fill="#292638"/><g transform="translate(112 0)"><path d="M47 44h174v33q-14 6 0 14v59H47v-59q14-8 0-14Z" fill="#F5F4E8" stroke="#10121A" stroke-width="3"/><path d="M36 35h174v33q-14 6 0 14v59H36v-59q14-8 0-14Z" fill="#F5F4E8" stroke="#10121A" stroke-width="3"/><g class="ticket"><path d="M25 26h174v33q-14 6 0 14v59H25v-59q14-8 0-14Z" fill="#F5F4E8" stroke="#10121A" stroke-width="3"/><text x="38" y="52" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#10121A">CIVICDESK</text><path d="M39 65H177 M39 81H119 M39 92H99" class="" fill="none" stroke="#10121A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="stamp"><circle cx="161" cy="97" r="19" fill="#65E4FF" class=""/><path d="M149 97l8 8 15-17" class="" fill="none" stroke="#10121A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="20" y="204" font-family="Consolas,monospace" font-size="15" font-weight="700" fill="#65E4FF">COMPLAINT MANAGEMENT</text><text x="20" y="255" font-family="Impact,Arial Black,sans-serif" font-size="44" font-weight="400" fill="#F5F4E8">CivicDesk</text><text x="20" y="288" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">A citizen files a complaint. A server</text><text x="20" y="314" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">action validates the form and saves a</text><text x="20" y="340" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">ticket. Agents and supervisors track it</text><text x="20" y="366" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">through resolution.</text><text x="20" y="420" font-family="Consolas,monospace" font-size="15" font-weight="400" fill="#65E4FF">Next.js / Prisma / PostgreSQL</text></svg>