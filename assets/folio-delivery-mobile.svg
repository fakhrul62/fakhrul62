op and Canva.</text><path d="M20 428H440" class="" fill="none" stroke="#414451" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="452" font-family="Consolas,monospace" font-size="16" font-weight="700" fill="#B69BFF">Also explored</text><text x="20" y="489" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">Supabase, Firebase, React Context and</text><text x="20" y="515" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">foundational work with Shopify, Wix and</text><text x="20" y="541" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">Odoo.</text></svg>