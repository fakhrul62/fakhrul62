<svg xmlns="http://www.w3.org/2000/svg" width="900" height="193" viewBox="0 0 900 193"><rect x="0" y="0" width="900" height="193" fill="#10121A"/><rect x="0" y="0" width="900" height="4" fill="#FF8659"/><text x="20" y="52" font-family="Impact,Arial Black,sans-serif" font-size="40" font-weight="400" fill="#FF8659">Work with me</text><path d="M20 75H880" class="" fill="none" stroke="#414451" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="101" font-family="Consolas,monospace" font-size="18" font-weight="700" fill="#FF8659">Collaboration</text><text x="276" y="101" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">Have a web app to build, a slow website to improve, or</text><text x="276" y="127" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">an API to integrate? I welcome project and open-source</text><text x="276" y="153" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">collaborations.</text></svg>