<svg xmlns="http://www.w3.org/2000/svg" width="900" height="248" viewBox="0 0 900 248"><style>@media(prefers-reduced-motion:no-preference){
.contour{animation:contour 5s linear infinite;stroke-dasharray:10 8}
@keyframes contour{to{stroke-dashoffset:-72}}
.ticket{animation:ticket 4.8s ease-in-out infinite}@keyframes ticket{0%,22%,100%{transform:translate(0,0)}58%,76%{transform:translate(12px,-12px)}}
.stamp{animation:stamp 4.8s ease-in-out infinite;transform-origin:161px 97px}@keyframes stamp{0%,26%,93%,100%{opacity:0;transform:scale(1.3)}43%,82%{opacity:1;transform:scale(1)}}
.flight{animation:flight 5s linear infinite;stroke-dasharray:9 9}@keyframes flight{to{stroke-dashoffset:-90}}
.beacon{animation:beacon 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beacon{0%,100%{opacity:.8;transform:scale(.8)}80%{opacity:.1;transform:scale(1.7)}}
}</style><rect x="0" y="0" width="900" height="248" fill="#0d1117"/><rect x="0" y="0" width="900" height="4" fill="#FF8659"/><rect x="0" y="4" width="240" height="244" fill="#292638"/><g transform="translate(0 34.0)"><circle cx="118" cy="91" r="65" fill="none" stroke="#FF8659" stroke-width="3"/><ellipse cx="118" cy="91" rx="24" ry="65" fill="none" stroke="#FF8659"/><ellipse cx="118" cy="91" rx="48" ry="65" fill="none" stroke="#FF8659"/><ellipse cx="118" cy="91" rx="65" ry="19" fill="none" stroke="#FF8659"/><ellipse cx="118" cy="91" rx="65" ry="43" fill="none" stroke="#FF8659"/><path d="M26 127Q104 14 190 57Q244 90 162 131" class="flight" fill="none" stroke="#F5F4E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="91" r="5" fill="#F5F4E8" class=""/><circle cx="164" cy="130" r="7" fill="#FF8659" class="beacon"/></g><text x="268" y="40" font-family="Consolas,monospace" font-size="15" font-weight="700" fill="#FF8659">ITINERARY BUILDER</text><text x="268" y="91" font-family="Impact,Arial Black,sans-serif" font-size="44" font-weight="400" fill="#F5F4E8">AI Travel Planner</text><text x="268" y="124" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">Turn travel preferences into a personalised itinerary. A</text><text x="268" y="150" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">React dashboard brings together Gemini trip suggestions</text><text x="268" y="176" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#F5F4E8">and MongoDB storage.</text><text x="268" y="230" font-family="Consolas,monospace" font-size="15" font-weight="400" fill="#FF8659">React / Next.js / Gemini / MongoDB</text></svg>